<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Peças</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header></header>
    <main>
        <!-- Modal de Alertas -->
        <div class="alert-overlay" id="alertOverlay">
            <div class="alert-modal success" id="alertModal">

                <!-- Ícone do alerta -->
                <div class="alert-icon" id="alertIcon">
                    <!-- Ícone de Sucesso (Check) por padrão -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>

                <!-- Título e Mensagem -->
                <h3 class="alert-title" id="alertTitle">Sucesso!</h3>
                <p class="alert-message" id="alertMessage">Cadastro realizado com sucesso.</p>

                <!-- Botão de Fechar/OK -->
                <button class="alert-btn" onclick="fecharAlerta()">Continuar</button>
            </div>
        </div>
        <div class="modal">
            <div class="titulo_"></div>

            <label for="nome">
                <input type="text" id="nome" placeholder="Nome da peça">
            </label>

            <label for="valor">
                <input type="text" id="valor" placeholder="Valor (R$)" inputmode="decimal">
            </label>

            <label for="descricao">
                <textarea id="descricao" placeholder="Descrição da peça" rows="3"></textarea>
            </label>

            <label for="data">
                <input type="date" id="data" placeholder="Data de entrada">
            </label>

            <div class="area">
                <label for="categoria">Categoria:</label>

                <div class="box_input">
                    <select name="categoria" id="perfil_input">
                        <option value="" selected disabled>Selecione uma categoria</option>
                        <option value="Ferragem">Ferragem</option>
                        <option value="Madeira">Madeira</option>
                        <option value="Serra">Serra</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>
            </div>

            <div class="area">
                <label>Condição:</label>

                <div class="opcoes_genero">
                    <label class="check_genero">
                        <input type="radio" name="condicao" value="novo" id="condicao-novo" class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Novo</span>
                    </label>

                    <label class="check_genero">
                        <input type="radio" name="condicao" value="usado" id="condicao-usado" class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Usado</span>
                    </label>

                    <label class="check_genero">
                        <input type="radio" name="condicao" value="recondicionado" id="condicao-recond"
                            class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Recondicionado</span>
                    </label>
                </div>
            </div>

            <button type="submit" onclick="validacaoCampos()">CADASTRAR</button>
        </div>
    </main>
    <footer></footer>
</body>

<script src="main.js"></script>

</html>
