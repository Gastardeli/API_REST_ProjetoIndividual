<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header></header>
    <main>
        <div class="modal">
            <div class="titulo_"></div>
            <label for="email">
                <input type="text" id="email" placeholder="Usuário">
            </label>
            <label for="senha">
                <input type="password" id="senha" placeholder="Senha">
            </label>
            <div class="area">
                <label>Gênero:</label>

                <div class="opcoes_genero">
                    <label class="check_genero">
                        <input type="radio" name="genero" value="masculino" id="genero-m" class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Masculino</span>
                    </label>

                    <label class="check_genero">
                        <input type="radio" name="genero" value="feminino" id="genero-f" class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Feminino</span>
                    </label>

                    <label class="check_genero">
                        <input type="radio" name="genero" value="outro" id="genero-o" class="cbx-input">
                        <span class="check">
                            <svg width="18px" height="18px" viewBox="0 0 18 18">
                                <path
                                    d="M1,9 L1,3.5 C1,2 2,1 3.5,1 L14.5,1 C16,1 17,2 17,3.5 L17,14.5 C17,16 16,17 14.5,17 L3.5,17 C2,17 1,16 1,14.5 L1,9 Z">
                                </path>
                                <polyline points="1 9 7 14 15 4"></polyline>
                            </svg>
                        </span>
                        <span>Outro</span>
                    </label>
                </div>
            </div>

            <div class="area">
                <label for="perfil">Perfil de acesso:</label>

                <div class="box_input">
                    <select name="perfil" id="perfil_input">
                        <option value="" selected disabled>Selecione um perfil</option>
                        <option value="administrador">Administrador</option>
                        <option value="gestor">Gestor</option>
                        <option value="estoquista">Estoquista</option>
                        <option value="visualizacao">Visualização</option>
                    </select>
                </div>
            </div>
            <button type="submit">ENTRAR</button>
        </div>
    </main>
    <footer></footer>
</body>

</html>
